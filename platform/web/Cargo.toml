[package]
name = "mofact-web"
description = "The browser shell: the real game on a canvas, for the playable web link."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
mofact.workspace = true
mofact-core.workspace = true
mofact-sim.workspace = true
mofact-input.workspace = true
mofact-render.workspace = true
wgpu = { workspace = true, features = ["webgl"] }
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "CssStyleDeclaration",
    "DomRect",
    "Event",
    "EventTarget",
    "PointerEvent",
    "MouseEvent",
    "WheelEvent",
    "KeyboardEvent",
    "Storage",
    "Location",
    "VisibilityState",
    "AddEventListenerOptions",
    "Performance",
    "console",
] }

[lints]
workspace = true
