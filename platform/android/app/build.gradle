plugins {
    id 'com.android.application'
}

android {
    // The store id; settle it before the first Play upload (T04), as it can't change after.
    namespace = "com.mofact.game"
    compileSdk 35
    defaultConfig {
        applicationId "com.mofact.game"
        // Vulkan, which wgpu draws with here, is dependable from Android 8.
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv("MOFACT_VERSION_CODE") ?: "1")
        // One version for every platform: the workspace's, in Cargo.toml.
        versionName((rootProject.file('../../Cargo.toml').text =~ /(?m)^version = "([^"]+)"/)[0][1])
        ndk {
            abiFilters 'arm64-v8a'
        }
        // RevenueCat's public Android key (T61). Left empty, the game sells
        // nothing and unlocks through its free sandbox instead.
        def revenueCatKey = project.findProperty('mofactRevenueCatKey') ?: System.getenv('MOFACT_REVENUECAT_KEY') ?: ''
        buildConfigField 'String', 'REVENUECAT_KEY', "\"${revenueCatKey}\""
    }
    buildFeatures {
        buildConfig = true
    }
    sourceSets.main {
        java.srcDirs += ['../sdl-java']
        jniLibs.srcDirs = ['libs']
    }
    buildTypes {
        release {
            minifyEnabled false
            // Unsigned until the Play upload key arrives (T04); debug builds install as they are.
        }
    }
    lint {
        abortOnError = false
    }
}

dependencies {
    // The full game's purchase (T61).
    implementation 'com.revenuecat.purchases:purchases:8.10.0'
}
