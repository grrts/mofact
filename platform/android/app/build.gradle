plugins {
    id 'com.android.application'
}

android {
    // The store id; settle it before the first Play upload (T04), as it can't change after.
    namespace = "com.mofact.game"
    compileSdk 35
    defaultConfig {
        applicationId "com.mofact.game"
        // Vulkan, which wgpu draws with here, is dependable from Android 8.
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv("MOFACT_VERSION_CODE") ?: "1")
        versionName "0.1.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    sourceSets.main {
        java.srcDirs += ['../sdl-java']
        jniLibs.srcDirs = ['libs']
    }
    buildTypes {
        release {
            minifyEnabled false
            // Unsigned until the Play upload key arrives (T04); debug builds install as they are.
        }
    }
    lint {
        abortOnError = false
    }
}
