[package]
name = "mofact-android"
description = "The Android entry point: libmain.so, which SDL's Java activity loads and starts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# SDLActivity loads libmain.so and calls its SDL_main.
name = "main"
crate-type = ["cdylib"]

# Only Android builds the game into it, so desktop workspace builds stay quick.
[target.'cfg(target_os = "android")'.dependencies]
mofact.workspace = true
sdl3.workspace = true

[lints]
workspace = true
