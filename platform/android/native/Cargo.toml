[package]
name = "mofact-android"
description = "The Android entry point: libmain.so, which SDL's Java activity loads and starts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# SDLActivity loads libmain.so and calls its SDL_main.
name = "main"
crate-type = ["cdylib"]

# The store bridge builds and is tested everywhere; only Android links
# the game into libmain.so.
[dependencies]
mofact.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
sdl3.workspace = true
jni = "0.21"


[lints]
workspace = true
