name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages for SDL3 and a software GPU
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libasound2-dev libpulse-dev mesa-vulkan-drivers xvfb
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is a ship target (Steam); macOS is where the iOS build will run (T02).
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages for SDL3 and a software GPU
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libasound2-dev libpulse-dev mesa-vulkan-drivers xvfb
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      # The app shell on a real GPU: present frames, go to the background and back (T03).
      # Linux uses Mesa's software Vulkan under a virtual display; Windows runners have no GPU.
      - name: App shell smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo run -p mofact -- --frames 120
      # Airplane mode (T64): the same run with no network at all, as a
      # fresh network namespace has none. Nothing may wait on it.
      - name: App shell offline
        if: runner.os == 'Linux'
        run: |
          cargo build -p mofact
          # As root: it saves under /root, which is writable for it.
          sudo unshare -n -- xvfb-run -a ./target/debug/mofact --frames 120
      - name: App shell smoke test
        if: runner.os == 'macOS'
        run: cargo run -p mofact -- --frames 120
      # Renderer tests that need a GPU, and screenshots at three zooms (T16).
      - name: GPU tests and screenshots
        if: runner.os == 'Linux'
        run: |
          cargo test -p mofact-render -- --ignored
          cargo run -p mofact -- --screenshot screenshots/starter-line
          cargo run -p mofact -- --screenshot screenshots/circuit-chain --scenario scenarios/circuit-chain.ron
          # The store screenshots (docs/store): fails if a machine in the showcase is stuck.
          cargo run -p mofact -- --store screenshots/store --scenario tools/store/showcase.ron
          python3 tools/store/check.py
          # The app icon at every size (T68) matches its drawing.
          cargo run -p mofact-icon -- --check
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: screenshots
          path: screenshots/
      - run: cargo run -p mofact-balance -- data
      # How long the bot's playthrough takes, worked out from the content:
      # it fails outside 80 to 120 hours. The nightly run plays it for real.
      - run: cargo run -p mofact-bot -- --estimate data
      - run: cargo run --release -p mofact-headless -- scenarios data
      # Tick time on the starter, R44 budget and 2x stress bases, per runner (T23).
      - name: Benchmarks
        shell: bash
        run: cargo run --release -p mofact-bench -- --summary "$GITHUB_STEP_SUMMARY"

  web:
    name: Web game
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The browser shell only compiles for wasm, so lint it there too.
      - run: cargo clippy -p mofact-web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo build --release -p mofact-web --target wasm32-unknown-unknown
      # Play the built page in a real browser, as Chrome and as a browser
      # without vibration or a clipboard (Safari on iPhone), and fail on
      # any error it throws.
      - name: Install wasm-bindgen
        run: |
          version=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          name="wasm-bindgen-${version}-x86_64-unknown-linux-musl"
          if curl -sSfL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/${name}.tar.gz" | tar -xz; then
            echo "$PWD/${name}" >> "$GITHUB_PATH"
          else
            cargo install --locked wasm-bindgen-cli --version "$version"
          fi
      - name: Browser smoke test
        run: |
          mkdir -p site
          cp -R web/. site/
          wasm-bindgen --target web --no-typescript --out-dir site target/wasm32-unknown-unknown/release/mofact_web.wasm
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node tools/websmoke/smoke.cjs site
