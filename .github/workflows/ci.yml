name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages for SDL3 and a software GPU
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libasound2-dev libpulse-dev mesa-vulkan-drivers xvfb
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is a ship target (Steam); macOS is where the iOS build will run (T02).
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages for SDL3 and a software GPU
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libasound2-dev libpulse-dev mesa-vulkan-drivers xvfb
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      # The app shell on a real GPU: present frames, go to the background and back (T03).
      # Linux uses Mesa's software Vulkan under a virtual display; Windows runners have no GPU.
      - name: App shell smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo run -p mofact -- --frames 120
      - name: App shell smoke test
        if: runner.os == 'macOS'
        run: cargo run -p mofact -- --frames 120
      # Renderer tests that need a GPU, and screenshots at three zooms (T16).
      - name: GPU tests and screenshots
        if: runner.os == 'Linux'
        run: |
          cargo test -p mofact-render -- --ignored
          cargo run -p mofact -- --screenshot screenshots/starter-line
          cargo run -p mofact -- --screenshot screenshots/circuit-chain --scenario scenarios/circuit-chain.ron
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: screenshots
          path: screenshots/
      - run: cargo run -p mofact-balance -- data
      - run: cargo run --release -p mofact-headless -- scenarios data
      # Tick time on the starter, R44 budget and 2x stress bases, per runner (T23).
      - name: Benchmarks
        shell: bash
        run: cargo run --release -p mofact-bench -- --summary "$GITHUB_STEP_SUMMARY"

  web:
    name: Web engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p mofact-web --target wasm32-unknown-unknown
