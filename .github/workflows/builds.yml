name: Builds

# Installable builds of every commit for the three ship platforms (T02):
# an Android APK, an iOS app (run on the simulator as a smoke test) and a
# Windows exe. Signed store uploads (TestFlight, Play internal testing, the
# Steam beta branch) join once the store accounts and keys exist (T04).

on:
  push:
    branches: [main]
    # A tag like v0.2.0 also makes a GitHub release of these builds.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p mofact
      - uses: actions/upload-artifact@v4
        with:
          name: mofact-windows
          path: target/release/mofact.exe

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Build libmain.so
        run: |
          sudo apt-get install -y -q ninja-build
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          # SDL builds with CMake: use the NDK's own toolchain file, which
          # knows Android's ABIs, rather than cmake-rs's guesses.
          export CMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          export ANDROID_ABI=arm64-v8a ANDROID_PLATFORM=android-26 CMAKE_GENERATOR=Ninja
          cargo ndk -t arm64-v8a --platform 26 -o platform/android/app/libs build --release -p mofact-android
          ls -l platform/android/app/libs/arm64-v8a
      - name: SDL's Java activity, matching the SDL in libmain.so
        run: |
          sdl=$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name == "sdl3-src") | .manifest_path')
          cp -r "$(dirname "$sdl")/SDL/android-project/app/src/main/java" platform/android/sdl-java
      - name: Build the APK
        env:
          MOFACT_VERSION_CODE: ${{ github.run_number }}
          # RevenueCat's public Android key; until the secret is set the
          # APK unlocks the full game through the free sandbox (T61).
          MOFACT_REVENUECAT_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
        run: |
          gradle -p platform/android assembleDebug
          cp platform/android/app/build/outputs/apk/debug/app-debug.apk mofact.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mofact-android
          path: mofact.apk

  ios:
    name: iOS
    runs-on: macos-latest
    env:
      # Matches MinimumOSVersion in Info.plist; SDL (via CMake) and Rust must agree.
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Build for devices
        run: cargo build --release -p mofact-ios --target aarch64-apple-ios
      - name: Build for the simulator
        run: cargo build --release -p mofact-ios --target aarch64-apple-ios-sim
      - name: Bundle the apps
        run: |
          for t in aarch64-apple-ios aarch64-apple-ios-sim; do
            app=platform/ios/build/$t/Mofact.app
            mkdir -p "$app"
            cp target/$t/release/Mofact "$app/"
            cp platform/ios/Info.plist "$app/"
            cp platform/ios/icons/*.png "$app/"
            plutil -replace CFBundleVersion -string "${{ github.run_number }}" "$app/Info.plist"
          done
      # Install on a simulator, launch, and check the game is still running
      # and drawing a few seconds later.
      - name: Smoke test on the simulator
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          echo "simulator $udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"
          xcrun simctl install "$udid" platform/ios/build/aarch64-apple-ios-sim/Mofact.app
          xcrun simctl launch "$udid" com.mofact.game
          sleep 20
          xcrun simctl io "$udid" screenshot ios-simulator.png
          pgrep -fl "Mofact.app/Mofact" || { echo "the game is not running"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mofact-ios
          path: |
            platform/ios/build/aarch64-apple-ios/Mofact.app
            ios-simulator.png

  # A version tag: check it names the workspace version, then publish the
  # three builds and the changelog's entry as a GitHub release.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches Cargo.toml and the changelog
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, but Cargo.toml says $version"; exit 1; }
          grep -q "^## $version" CHANGELOG.md || { echo "CHANGELOG.md has no ## $version"; exit 1; }
          awk -v v="## $version" '$0 ~ "^## " { on = index($0, v) == 1; if (on) next } on' CHANGELOG.md > notes.md
      - uses: actions/download-artifact@v4
        with:
          path: builds
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd builds
          cp mofact-windows/mofact.exe "mofact-$GITHUB_REF_NAME-windows.exe"
          cp mofact-android/mofact.apk "mofact-$GITHUB_REF_NAME-android-unsigned.apk"
          (cd mofact-ios && zip -qr "../mofact-$GITHUB_REF_NAME-ios-unsigned.zip" .)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Mofact $GITHUB_REF_NAME" --notes-file ../notes.md \
            mofact-$GITHUB_REF_NAME-*
