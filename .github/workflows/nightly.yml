name: Nightly playthrough

# T60, the phase 4 exit: a bot plays a new game from raw ore to the
# finished megaproject, headless, through player commands only. A full
# playthrough is meant to take about 100 hours of game time: it fails if
# the bot can't finish within 120 hours, or wins in under 80. The log of
# what it built and when is kept as an artifact.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  playthrough:
    name: Bot plays to the megaproject
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p mofact-bot
      - name: Play
        run: ./target/release/mofact-bot data 120 | tee playthrough.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playthrough-log
          path: playthrough.log
